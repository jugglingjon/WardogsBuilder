name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # The working branch deploys too, so the hosted copy can be tried before
      # anything is merged.
      - claude/wardogs-building-planner-99yp1c
  workflow_dispatch:

# Pages deployments authenticate with a short-lived OIDC token rather than a
# stored secret, which is what id-token: write is for.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A red build should not reach the hosted copy.
      - run: npm test

      - run: npm run build

      # Pages has to be switched on once by hand: creating the site through the
      # API needs admin rights that the workflow token does not have, and
      # enablement: true fails with "Resource not accessible by integration".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
